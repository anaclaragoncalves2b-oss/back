
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-end</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header>
             <h1>Painel de Alunos</h1>
             <p>Demonstração de CRUD Frontend/Backend (Node.js)</p>
             <button onclick="window.print()" style="margin-top: 1rem; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; background-color: #fcfdfe; color: var(--primary-color);">⬇️Baixar PDF</button>
        </header>
        <!-- Conteúdo Principal -->
        <main>
            <section class="form-section">
                <h2>Novo Aluno</h2>
                <form id="aluno-form">

                    <input type="hidden" id="aluno-id">

                    <!-- Campos do Formulário -->
                    <div class="input-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" required placeholder="Ex: João da Silva">
                    </div>

                    <div class="input-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required placeholder="Ex: joao.silva@example.com">
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="Ex: 71248947112">
                    </div>

                    <div class="input-group">
                        <label for="data">Data de nascimento:</label>
                        <input type="text" id="data" required placeholder="Ex: 05/12/2003">
                    </div>
                    
                    <div class="input-group">
                        <label for="curso">Curso</label>
                        <select id="curso" required>
                            <option value="">Selecione um curso...</option>
                            <option value="Anlise de sistemas">Anlise de sistemas</option>
                            <option value="Engenharia de software">Engenharia de software</option>
                            <option value="Ciência da Computação">Ciência da Computação</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button class="btn-cancel" type="button" id="btn-cancel" style="display: none;">Cancelar Edição</button>
                        <button class="btn-save" type="submit" id="btn-save">Salvar Aluno</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <h2>Lista de Alunos</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>CPF</th>
                                <th>data</th>
                                <th>Curso</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="alunos-tbody">
                            <!-- Os alunos serão inseridos aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
